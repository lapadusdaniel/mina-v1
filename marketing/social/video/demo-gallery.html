<!doctype html>
<html lang="ro">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>MINA — Galerie demo</title>
  <style>
    * { box-sizing: border-box; }
    html { scroll-behavior: auto; }
    body { margin: 0; background: #f8f8f7; color: #202023; font-family: Arial, Helvetica, sans-serif; }
    header { height: 74px; position: sticky; top: 0; z-index: 20; display: flex; align-items: center; justify-content: space-between; padding: 0 42px; background: rgba(255,255,255,.94); border-bottom: 1px solid rgba(0,0,0,.07); backdrop-filter: blur(14px); }
    .logo { font: 400 23px/1 Georgia, serif; letter-spacing: .34em; }
    .header-actions { display: flex; gap: 10px; }
    .header-actions span { padding: 9px 14px; border: 1px solid #dedee2; border-radius: 999px; font-size: 12px; }
    .hero { min-height: 320px; display: grid; place-items: center; text-align: center; padding: 70px 20px 50px; background: #fff; }
    .hero small { color: #9a7b4d; font-size: 11px; font-weight: 700; letter-spacing: .16em; text-transform: uppercase; }
    .hero h1 { max-width: 800px; margin: 24px auto 14px; font: 400 60px/.98 Georgia, serif; letter-spacing: -.04em; }
    .hero p { margin: 0; color: #85858a; font-size: 14px; }
    .gallery { max-width: 1260px; margin: 0 auto; padding: 34px 28px 180px; column-count: 3; column-gap: 14px; }
    .photo { position: relative; display: inline-block; width: 100%; margin: 0 0 14px; overflow: hidden; border-radius: 14px; background: #e9e9e7; break-inside: avoid; }
    .photo.tall { aspect-ratio: 4 / 5; }
    .photo.wide { aspect-ratio: 4 / 3; }
    .photo.portrait { aspect-ratio: 3 / 4; }
    .photo img { width: 100%; height: 100%; display: block; object-fit: cover; transform: scale(1.01); }
    .photo button { position: absolute; right: 12px; top: 12px; width: 38px; height: 38px; border: 0; border-radius: 50%; display: grid; place-items: center; opacity: 0; pointer-events: none; background: rgba(255,255,255,.92); color: #252529; font-size: 20px; box-shadow: 0 2px 10px rgba(0,0,0,.10); transition: opacity .2s ease, transform .2s ease, background .2s ease, color .2s ease; }
    .photo:hover button, .photo:focus-within button, .photo button.selected { opacity: 1; pointer-events: auto; }
    .photo button.selected { transform: scale(1.08); background: #242427; color: #fff; }
    .photo button.selected::after { content: '♥'; }
    .photo button:not(.selected)::after { content: '♡'; }
    .favorites { position: fixed; z-index: 30; left: 50%; bottom: 24px; transform: translate(-50%, 120px); display: flex; align-items: center; gap: 12px; padding: 12px 18px; border: 0; border-radius: 999px; background: #202023; color: #fff; box-shadow: 0 12px 36px rgba(0,0,0,.25); font-size: 13px; transition: transform .35s cubic-bezier(.2,.8,.2,1); }
    .favorites.visible { transform: translate(-50%, 0); }
    .favorites strong { min-width: 22px; height: 22px; display: grid; place-items: center; border-radius: 50%; background: #b8965a; font-size: 11px; }
    .sheet-backdrop { position: fixed; inset: 0; z-index: 40; display: grid; align-items: end; background: rgba(0,0,0,.38); opacity: 0; pointer-events: none; transition: opacity .35s ease; }
    .sheet-backdrop.open { opacity: 1; }
    .sheet { padding: 28px 26px 34px; border-radius: 24px 24px 0 0; background: #fff; transform: translateY(100%); transition: transform .4s cubic-bezier(.2,.8,.2,1); }
    .sheet-backdrop.open .sheet { transform: translateY(0); }
    .sheet small { color: #9a7b4d; font-weight: 700; letter-spacing: .12em; text-transform: uppercase; }
    .sheet h2 { margin: 16px 0 8px; font: 400 34px/1 Georgia, serif; }
    .sheet p { margin: 0 0 22px; color: #85858a; font-size: 13px; }
    .sheet .submit { width: 100%; padding: 15px; border: 0; border-radius: 12px; background: #202023; color: #fff; font-weight: 700; }
    footer { height: 260px; display: grid; place-items: center; text-align: center; background: #202023; color: #f6f3ed; }
    footer span { display: block; font: 400 25px/1 Georgia, serif; letter-spacing: .34em; }
    footer p { color: #bdb9b2; font-size: 12px; }
    @media (max-width: 700px) {
      header { height: 58px; padding: 0 18px; }
      .logo { font-size: 18px; }
      .header-actions span:first-child { display: none; }
      .header-actions span { padding: 7px 10px; font-size: 10px; }
      .hero { min-height: 245px; padding: 55px 18px 38px; }
      .hero h1 { font-size: 43px; }
      .hero p { font-size: 12px; }
      .gallery { padding: 14px 10px 150px; column-count: 2; column-gap: 8px; }
      .photo { margin-bottom: 8px; border-radius: 9px; }
      .photo button { right: 7px; top: 7px; width: 28px; height: 28px; opacity: .38; pointer-events: auto; color: #fff; background: rgba(25,25,28,.45); font-size: 14px; box-shadow: 0 2px 8px rgba(0,0,0,.08); }
      .photo button.selected { opacity: 1; background: rgba(25,25,28,.72); }
      footer { height: 220px; }
    }
  </style>
</head>
<body>
  <header>
    <div class="logo">MINA</div>
    <div class="header-actions"><span>Nunta Mădălina și Daniel</span><span>Descarcă</span></div>
  </header>
  <section class="hero">
    <div><small>18 mai 2026</small><h1>Nunta Mădălina și Daniel</h1><p>Fotografii care rămân pentru totdeauna</p></div>
  </section>
  <main class="gallery">
    <article class="photo tall"><img src="assets/photo-01.png" alt=""><button aria-label="Selectează fotografia"></button></article>
    <article class="photo wide"><img src="assets/photo-03.png" alt=""><button aria-label="Selectează fotografia"></button></article>
    <article class="photo portrait"><img src="assets/photo-04.png" alt=""><button aria-label="Selectează fotografia"></button></article>
    <article class="photo tall"><img src="assets/photo-02.png" alt=""><button aria-label="Selectează fotografia"></button></article>
    <article class="photo portrait"><img src="assets/photo-04.png" style="object-position:38% center" alt=""><button aria-label="Selectează fotografia"></button></article>
    <article class="photo wide"><img src="assets/photo-03.png" style="object-position:center 38%" alt=""><button aria-label="Selectează fotografia"></button></article>
    <article class="photo portrait"><img src="assets/photo-01.png" style="object-position:62% center" alt=""><button aria-label="Selectează fotografia"></button></article>
    <article class="photo tall"><img src="assets/photo-02.png" style="object-position:42% center" alt=""><button aria-label="Selectează fotografia"></button></article>
    <article class="photo wide"><img src="assets/photo-03.png" style="object-position:35% center" alt=""><button aria-label="Selectează fotografia"></button></article>
    <article class="photo tall"><img src="assets/photo-04.png" alt=""><button aria-label="Selectează fotografia"></button></article>
    <article class="photo portrait"><img src="assets/photo-01.png" style="object-position:46% center" alt=""><button aria-label="Selectează fotografia"></button></article>
    <article class="photo wide"><img src="assets/photo-03.png" style="object-position:70% center" alt=""><button aria-label="Selectează fotografia"></button></article>
  </main>
  <footer><div><span>MINA</span><p>Galerie livrată prin cloudbymina.com</p></div></footer>
  <button class="favorites" type="button"><strong>0</strong><span>Vezi selecția</span></button>
  <div class="sheet-backdrop"><div class="sheet"><small>Selecția ta</small><h2>3 fotografii selectate</h2><p>Poți reveni oricând înainte să trimiți selecția.</p><button class="submit" type="button">Trimite selecția</button></div></div>
  <script>
    const hearts = [...document.querySelectorAll('.photo button')]
    const favorites = document.querySelector('.favorites')
    const count = favorites.querySelector('strong')
    const sheet = document.querySelector('.sheet-backdrop')
    hearts.forEach((button) => button.addEventListener('click', () => {
      button.classList.toggle('selected')
      const selected = document.querySelectorAll('.photo button.selected').length
      count.textContent = selected
      favorites.classList.toggle('visible', selected > 0)
    }))
    favorites.addEventListener('click', () => sheet.classList.add('open'))
  </script>
</body>
</html>
